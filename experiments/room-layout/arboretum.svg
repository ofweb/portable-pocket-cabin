<text x="700" y="181" font-family="sans-serif" font-size="14" fill="#4774a6" text-anchor="start">19×19 / 10 · 20 positions</text>
<text x="700" y="207" font-family="sans-serif" font-size="14" fill="#64713d" text-anchor="start">29×29 / 15 · 42 positions</text>
<text x="700" y="247" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">Final wall: 29 wide, 15 tall</text>
<text x="700" y="273" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">Final tier: no visible ceiling</text>
<text x="700" y="313" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">39×39: sparse biome clues</text>
<text x="700" y="339" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">45×45: critters and snow cover</text>
<text x="700" y="365" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">51×51: normal biome undergrowth</text>
<text x="700" y="405" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">Dashed lines mark dimensions.</text>
<text x="700" y="431" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">Species and spacing blend gradually.</text>
<text x="700" y="471" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">Dashed outer walls exist only</text>
<text x="700" y="497" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">while the arboretum is enclosed.</text>
<text x="30" y="668" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">Final tier: walk around either end of the entrance wall into transition and woodland behind it.</text>
<text x="30" y="695" font-family="sans-serif" font-size="14" fill="#26344b" text-anchor="start">The woodland drawing is cropped, with no reachable outer edge. Planting points show the fixed core grid.</text>
