plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	mixin {
		useLegacyMixinAp = false
	}

	runs {
		startupTest {
			server()
			name "Dedicated Server Startup Seed Test"
			runDir "build/startup-test"
			vmArg "-Dportable-pocket-cabin.startup-test=seed"
			programArg "nogui"
		}
		startupReloadTest {
			server()
			name "Dedicated Server Startup Reload Test"
			runDir "build/startup-test"
			vmArg "-Dportable-pocket-cabin.startup-test=verify"
			programArg "nogui"
		}
		corridorTest {
			server()
			name "Corridor Installation and Interrupted Expansion Test"
			runDir "build/corridor-test"
			vmArg "-Dportable-pocket-cabin.corridor-test=seed"
			programArg "nogui"
		}
		corridorReloadTest {
			server()
			name "Corridor Expansion Recovery Test"
			runDir "build/corridor-test"
			vmArg "-Dportable-pocket-cabin.corridor-test=verify"
			programArg "nogui"
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "portable-pocket-cabin-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// Loom clears the client test directory; server GameTests also need a fresh world.
tasks.named("deleteGameTestRunDir", Delete) {
	delete(layout.buildDirectory.dir("run/gameTest"))
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("runStartupTest").configure {
	doFirst {
		def runDirectory = layout.projectDirectory.dir("build/startup-test").asFile
		project.delete(new File(runDirectory, "world"))
		runDirectory.mkdirs()
		new File(runDirectory, "logs/latest.log").delete()
		new File(runDirectory, "eula.txt").text = "eula=true\n"
		new File(runDirectory, "server.properties").text = "server-port=0\nonline-mode=false\n"
	}
	doLast {
		def logFile = layout.projectDirectory.file("build/startup-test/logs/latest.log").asFile
		if (!logFile.exists() || !logFile.text.contains("DEDICATED_SERVER_STARTUP_TEST_PASSED")) {
			throw new GradleException("Dedicated server did not complete the Portable Pocket Cabin startup check")
		}
	}
}

tasks.named("runStartupReloadTest").configure {
	dependsOn tasks.named("runStartupTest")
	doFirst {
		def runDirectory = layout.projectDirectory.dir("build/startup-test").asFile
		runDirectory.mkdirs()
		new File(runDirectory, "logs/latest.log").delete()
		new File(runDirectory, "eula.txt").text = "eula=true\n"
		new File(runDirectory, "server.properties").text = "server-port=0\nonline-mode=false\n"
	}
	doLast {
		def logFile = layout.projectDirectory.file("build/startup-test/logs/latest.log").asFile
		if (!logFile.exists() || !logFile.text.contains("DEDICATED_SERVER_RESTART_TEST_PASSED")) {
			throw new GradleException("Dedicated server did not reload the persisted cabin registry")
		}
	}
}

tasks.named("check").configure {
	dependsOn tasks.named("runStartupReloadTest")
	dependsOn tasks.named("runCorridorReloadTest")
}

tasks.named("runCorridorTest").configure {
	doFirst {
		def runDirectory = layout.projectDirectory.dir("build/corridor-test").asFile
		project.delete(new File(runDirectory, "world"))
		runDirectory.mkdirs()
		new File(runDirectory, "logs/latest.log").delete()
		new File(runDirectory, "eula.txt").text = "eula=true\n"
		new File(runDirectory, "server.properties").text = "server-port=0\nonline-mode=false\n"
	}
	doLast {
		def logFile = layout.projectDirectory.file("build/corridor-test/logs/latest.log").asFile
		if (!logFile.exists() || !logFile.text.contains("CORRIDOR_INSTALLATION_TEST_PASSED")) {
			throw new GradleException("Corridor installation and interruption checks did not finish")
		}
	}
}

tasks.named("runCorridorReloadTest").configure {
	dependsOn tasks.named("runCorridorTest")
	doFirst {
		new File(layout.projectDirectory.dir("build/corridor-test").asFile, "logs/latest.log").delete()
	}
	doLast {
		def logFile = layout.projectDirectory.file("build/corridor-test/logs/latest.log").asFile
		if (!logFile.exists() || !logFile.text.contains("CORRIDOR_RECOVERY_TEST_PASSED")) {
			throw new GradleException("Corridor recovery checks did not finish")
		}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
